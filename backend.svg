<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Backend stack: Node.js, NestJS, PostgreSQL, REST API" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <style>
      .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .h{font-size:22px;font-weight:700;fill:#e6edf3}
      .d{font-size:14px;fill:#9fb0cc}
      .m{font-family:Consolas,'Courier New',monospace;font-size:12px;fill:#7d8aa5}
      .bar{transform-origin:left center;transform:scaleX(0);animation:grow 1.4s ease-out forwards}
      @keyframes grow{to{transform:scaleX(1)}}
      @media (prefers-reduced-motion:reduce){.bar{animation:none;transform:scaleX(1)}}
    </style>
  </defs>
  <rect width="1000" height="360" rx="18" fill="url(#bg)"/>
  <text x="40" y="50" class="t" font-size="26" font-weight="800" fill="#e6edf3">Backend stack</text>
  <text x="40" y="74" class="t d">The newest part of my toolbox, and the part I'm building fastest.</text>

  <!-- Card 1 Node -->
  <g transform="translate(40,100)">
    <rect width="215" height="230" rx="14" fill="#0f1a2c" stroke="#3ddc97" stroke-opacity="0.5"/>
    <polygon points="38,26 62,40 62,68 38,82 14,68 14,40" transform="translate(16,10)" fill="#3ddc97"/>
    <text x="48" y="75" class="t" font-size="22" font-weight="800" fill="#0b1220" text-anchor="middle" transform="translate(16,0)">N</text>
    <text x="20" y="135" class="t h">Node.js</text>
    <text x="20" y="160" class="t d">Async server-side JS,</text>
    <text x="20" y="180" class="t d">event loop, npm tooling</text>
    <rect x="20" y="200" width="175" height="8" rx="4" fill="#1b2a42"/>
    <rect class="bar" x="20" y="200" width="150" height="8" rx="4" fill="#3ddc97"/>
  </g>

  <!-- Card 2 Nest -->
  <g transform="translate(270,100)">
    <rect width="215" height="230" rx="14" fill="#0f1a2c" stroke="#e0234e" stroke-opacity="0.5"/>
    <path d="M32 82 L32 36 L74 82 L74 36" transform="translate(6,6)" fill="none" stroke="#e0234e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="86" cy="38" r="6" fill="#e0234e"/>
    <text x="20" y="135" class="t h">NestJS</text>
    <text x="20" y="160" class="t d">Modules, controllers,</text>
    <text x="20" y="180" class="t d">services, DI, TypeScript</text>
    <rect x="20" y="200" width="175" height="8" rx="4" fill="#1b2a42"/>
    <rect class="bar" x="20" y="200" width="140" height="8" rx="4" fill="#e0234e" style="animation-delay:.2s"/>
  </g>

  <!-- Card 3 Postgres -->
  <g transform="translate(500,100)">
    <rect width="215" height="230" rx="14" fill="#0f1a2c" stroke="#4cc9f0" stroke-opacity="0.5"/>
    <g transform="translate(20,14)" fill="none" stroke="#4cc9f0" stroke-width="5">
      <ellipse cx="34" cy="14" rx="28" ry="10"/>
      <path d="M6 14 V46 C6 52 18 58 34 58 C50 58 62 52 62 46 V14"/>
      <path d="M6 30 C6 36 18 42 34 42 C50 42 62 36 62 30"/>
    </g>
    <text x="20" y="135" class="t h">PostgreSQL</text>
    <text x="20" y="160" class="t d">Relational design, SQL</text>
    <text x="20" y="180" class="t d">queries, joins, migrations</text>
    <rect x="20" y="200" width="175" height="8" rx="4" fill="#1b2a42"/>
    <rect class="bar" x="20" y="200" width="135" height="8" rx="4" fill="#4cc9f0" style="animation-delay:.4s"/>
  </g>

  <!-- Card 4 REST -->
  <g transform="translate(730,100)">
    <rect width="230" height="230" rx="14" fill="#0f1a2c" stroke="#ffb703" stroke-opacity="0.5"/>
    <g transform="translate(20,18)" fill="none" stroke="#ffb703" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 22 H56 M44 10 L56 22 L44 34"/>
      <path d="M56 50 H8 M20 38 L8 50 L20 62"/>
    </g>
    <text x="20" y="135" class="t h">REST API</text>
    <text x="20" y="160" class="t d">CRUD endpoints, status</text>
    <text x="20" y="180" class="t d">codes, validation, auth</text>
    <rect x="20" y="200" width="190" height="8" rx="4" fill="#1b2a42"/>
    <rect class="bar" x="20" y="200" width="160" height="8" rx="4" fill="#ffb703" style="animation-delay:.6s"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
