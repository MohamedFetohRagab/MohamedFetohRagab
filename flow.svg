<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Request flow: Client to NestJS Controller to Service to PostgreSQL" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111a2e"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7d8aa5"/></marker>
    <style>.t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}.n{font-size:17px;font-weight:700;fill:#e6edf3}.s{font-family:Consolas,monospace;font-size:12px;fill:#9fb0cc}</style>
  </defs>
  <rect width="1000" height="200" rx="18" fill="url(#bg)"/>
  <text x="40" y="42" class="t" font-size="20" font-weight="700" fill="#e6edf3">How a request moves through my APIs</text>

  <g class="t">
    <rect x="40"  y="80" width="170" height="80" rx="12" fill="#0f1a2c" stroke="#ffb703"/>
    <text x="125" y="115" text-anchor="middle" class="n">Client</text>
    <text x="125" y="138" text-anchor="middle" class="s">GET /users/1</text>

    <rect x="270" y="80" width="170" height="80" rx="12" fill="#0f1a2c" stroke="#e0234e"/>
    <text x="355" y="115" text-anchor="middle" class="n">Controller</text>
    <text x="355" y="138" text-anchor="middle" class="s">route + DTO check</text>

    <rect x="500" y="80" width="170" height="80" rx="12" fill="#0f1a2c" stroke="#3ddc97"/>
    <text x="585" y="115" text-anchor="middle" class="n">Service</text>
    <text x="585" y="138" text-anchor="middle" class="s">business logic</text>

    <rect x="730" y="80" width="230" height="80" rx="12" fill="#0f1a2c" stroke="#4cc9f0"/>
    <text x="845" y="115" text-anchor="middle" class="n">PostgreSQL</text>
    <text x="845" y="138" text-anchor="middle" class="s">SELECT ... WHERE id=1</text>
  </g>

  <path id="p" d="M210 120 H270 M440 120 H500 M670 120 H730" stroke="#7d8aa5" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M210 120 H270" stroke="#7d8aa5" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M440 120 H500" stroke="#7d8aa5" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M670 120 H730" stroke="#7d8aa5" stroke-width="2" marker-end="url(#ar)"/>

  <circle r="6" fill="#3ddc97">
    <animateMotion dur="3s" repeatCount="indefinite" path="M125 120 H845" />
  </circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
