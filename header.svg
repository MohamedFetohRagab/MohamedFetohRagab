<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Mohamed Foteh Ragab - Frontend Developer growing into backend with Node.js, NestJS, PostgreSQL" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc97"/>
      <stop offset="0.5" stop-color="#4cc9f0"/>
      <stop offset="1" stop-color="#e0234e"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1000" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="18" fill="url(#grid)"/>
  <rect x="0" y="0" width="1000" height="6" rx="3" fill="url(#ac)"/>

  <!-- terminal dots -->
  <circle cx="40" cy="38" r="6" fill="#ff5f56"/>
  <circle cx="62" cy="38" r="6" fill="#ffbd2e"/>
  <circle cx="84" cy="38" r="6" fill="#27c93f"/>
  <text x="110" y="43" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7d8aa5">~/MohamedFetohRagab</text>

  <text x="50" y="125" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#7d8aa5">Hi, I'm</text>
  <text x="50" y="185" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#ac)">Mohamed Foteh Ragab</text>

  <text x="50" y="230" font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#e6edf3">
    <tspan fill="#3ddc97">&gt;</tspan> Frontend Developer, now growing into backend
    <tspan fill="#4cc9f0">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>_</tspan>
  </text>

  <!-- decorative braces -->
  <text x="860" y="170" font-family="Consolas, monospace" font-size="130" fill="#ffffff" fill-opacity="0.05">{ }</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
